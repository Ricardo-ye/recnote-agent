<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RecNote Agent · 录音笔记整理 Agent</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">RN</div>
      <div>
        <div class="brand-name">RecNote Agent</div>
        <div class="brand-sub">录音笔记整理</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-route="dashboard"><span class="ni-icon">◱</span><span>工作台</span></a>
      <a class="nav-item" data-route="ingest"><span class="ni-icon">↧</span><span>摄入台</span></a>
      <a class="nav-item" data-route="inbox"><span class="ni-icon">◈</span><span>确认队列</span><span class="badge" id="badge-inbox">0</span></a>
      <a class="nav-item" data-route="library"><span class="ni-icon">☰</span><span>笔记库</span></a>
      <a class="nav-item" data-route="search"><span class="ni-icon">⌕</span><span>全文检索</span></a>
      <a class="nav-item" data-route="taxonomy"><span class="ni-icon">⑂</span><span>分类与标签</span></a>
      <a class="nav-item" data-route="settings"><span class="ni-icon">⚙</span><span>设置</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="pill" id="engine-state">引擎：本地算法</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">工作台</h1>
        <p id="page-desc" class="page-desc"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>

<script src="src/store.js"></script>
<script src="src/agent.js"></script>
<script src="src/search.js"></script>
<script src="src/app.js"></script>
</body>
</html>
